<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="color-scheme" content="dark"><title>酒馆骰子账簿</title><link rel="stylesheet" href="style.css?v=20261020-dialog"></head>
<body>
<header><a class="brand" href="./">骰 / 酒馆账簿</a><button id="refresh" type="button">刷新账簿</button></header>
<main>
<p id="connection" role="status">正在同步…</p>
<section aria-labelledby="ranking-title"><div class="section-title"><h1 id="ranking-title">排行榜</h1><span>净收益排序 · GP</span></div><div id="ranking"></div><section id="player-profile" aria-live="polite" aria-label="选手档案" hidden></section><details><summary>统计口径</summary><p>最高点数取公布值；胜负场次按已录入比赛的公布点数统计，平局不计胜负。待补录：历史不全；+：已知下限。</p></details></section>
<dialog id="match-dialog" class="match-dialog" aria-labelledby="match-dialog-title"><div class="match-dialog-header"><div><h2 id="match-dialog-title"></h2><p id="match-dialog-summary" class="muted"></p></div><button id="match-dialog-close" type="button" aria-label="关闭对局窗口">×</button></div><div id="match-dialog-list" class="profile-match-list"></div></dialog>
<section aria-labelledby="history-title"><div class="section-title"><h2 id="history-title">比赛记录</h2><span>最近 100 条</span></div><div id="history"></div></section>
<details id="admin"><summary>管理员</summary>
<form id="login"><label>管理员邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form>
<div id="desk" hidden><button id="logout" type="button">退出登录</button><form id="result"><h3>录入比赛结果</h3><div class="pair"><label>选手甲<select name="a" required></select></label><label>选手乙<select name="b" required></select></label></div><div class="pair"><label>甲公布点数<input name="score_a" type="number" min="0" max="1000000" step="1" required></label><label>乙公布点数<input name="score_b" type="number" min="0" max="1000000" step="1" required></label></div><label>胜负净盈亏金额（GP）<input name="stake" type="number" min="0" max="1000000" step="0.5" value="0" required></label><details><summary>私密真实点数（可选）</summary><div class="pair"><label>甲真实点数<input name="real_a" type="number" min="0" max="1000000" step="1"></label><label>乙真实点数<input name="real_b" type="number" min="0" max="1000000" step="1"></label></div><label>管理员备注<textarea name="secret" maxlength="2000"></textarea></label></details><p>按公布点数结算。赢家增加此金额，输家扣除同额；平局盈亏为 0。不自动掷骰。</p><output id="calculation" aria-live="polite">填入点数后显示结算预览。</output><label class="check"><input name="confirmed" type="checkbox" required>已核对公布点数与净盈亏金额，确认写入账簿</label><button id="save">保存比赛结果</button></form><h3>私密记录</h3><div id="secrets"></div></div><p id="admin-message" role="status"></p></details>
</main>
<script src="config.js"></script><script type="module" src="app.js?v=20261020-dialog"></script>
</body></html>
